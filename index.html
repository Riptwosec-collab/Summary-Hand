<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>แบบประเมินรายเดือน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="sheet-app locked" id="sheetApp" aria-label="ตารางแบบประเมินรายเดือน">
      <section class="admin-login" id="adminLogin">
        <form class="login-card" id="loginForm">
          <p class="eyebrow">Admin only</p>
          <h1>สรุปแบบประเมินการล้างมือ</h1>
          <p>กรอกรหัสผู้ดูแลเพื่อดูข้อมูลสรุปตามรายชื่อและ Moment</p>
          <label>
            รหัสผู้ดูแล
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">เข้าสู่ระบบ</button>
          <p class="login-error" id="loginError"></p>
        </form>
      </section>

      <header class="summary-toolbar" id="summaryToolbar">
        <div>
          <h1>สรุปแบบประเมินรายเดือน</h1>
          <p id="summaryStatus">รอโหลดข้อมูล</p>
        </div>
        <button type="button" id="logoutButton">ออกจากระบบ</button>
      </header>

      <section class="sheet-frame">
        <div class="sheet-scroll">
          <table class="assessment-table" id="assessmentTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>

      <nav class="month-tabs" id="monthTabs" aria-label="เลือกเดือน"></nav>
    </main>

    <script src="script.js"></script>
  </body>
</html>
